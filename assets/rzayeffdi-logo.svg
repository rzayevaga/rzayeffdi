<svg width="100%" height="100%" viewBox="0 0 320 90" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title">
  <title id="title">RZAYEFFDI</title>
  <defs>
    <!-- Matrix green gradient -->
    <linearGradient id="matrix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="50%" stop-color="#00d15a"/>
      <stop offset="100%" stop-color="#00a86b"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Rain gradient -->
    <linearGradient id="rainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39ff14" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Falling rain effect -->
  <g opacity="0.3">
    <rect x="50" width="2" height="40" fill="url(#rainGrad)">
      <animate attributeName="y" values="-50;100" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" width="2" height="50" fill="url(#rainGrad)">
      <animate attributeName="y" values="-60;100" dur="4s" begin="-1s" repeatCount="indefinite"/>
    </rect>
    <rect x="190" width="2" height="45" fill="url(#rainGrad)">
      <animate attributeName="y" values="-55;100" dur="3.8s" begin="-0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="260" width="2" height="55" fill="url(#rainGrad)">
      <animate attributeName="y" values="-65;100" dur="4.2s" begin="-1.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Central hexagon emblem -->
  <g id="emblem" transform="translate(45,45)" filter="url(#glow)">
    <polygon points="0,-22 18,-11 18,11 0,22 -18,11 -18,-11" 
             fill="none" 
             stroke="url(#matrix)" 
             stroke-width="2.5"/>
    <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" 
             fill="none" 
             stroke="#39ff14" 
             stroke-opacity="0.5" 
             stroke-width="1.5"/>
    
    <!-- Floating animation -->
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="45,43; 45,47; 45,43" 
      dur="3.5s" 
      repeatCount="indefinite"/>
  </g>

  <!-- Wordmark -->
  <g id="wordmark" filter="url(#glow)">
    <text x="85" y="53" 
          font-family="'Orbitron', 'Rajdhani', 'Consolas', monospace" 
          font-size="32" 
          font-weight="800" 
          letter-spacing="2.5" 
          fill="url(#matrix)" 
          stroke="#0a3" 
          stroke-width="0.5">
      RZAYEFFDI
    </text>
  </g>

  <!-- Animated scan highlight -->
  <rect x="-100" y="25" width="80" height="40" fill="#ffffff" opacity="0.06">
    <animate attributeName="x" values="-100;350" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Glowing particles -->
  <g opacity="0.4">
    <circle cx="30" cy="20" r="1.5" fill="#39ff14">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="75" r="1.5" fill="#39ff14">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="-0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="30" r="1.5" fill="#39ff14">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="-1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
